[package]
name = "rayon-bench-anth"
autobins = false
version = "0.1.0"
edition = "2021"
publish = false
description = "CPU thread-count / rayon experiments for candle quantized inference"

# Standalone: not part of the candle workspace.
[workspace]

[dependencies]
candle-core = { path = "../../candle-core" }
candle-nn = { path = "../../candle-nn" }
candle-transformers = { path = "../../candle-transformers" }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
anyhow = "1"
rayon = "1.11"

[profile.release]
debug = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(candle_0102)'] }

[[bin]]
name = "llm_sweep"
path = "../src/bin/llm_sweep.rs"
[[bin]]
name = "qmatmul_sweep"
path = "../src/bin/qmatmul_sweep.rs"
[[bin]]
name = "quantize_sweep"
path = "../src/bin/quantize_sweep.rs"

# Anthropic's rayon-core fork (adaptive idle spinning), checked out locally:
#   git -C ../../../rayon worktree add ../rayon-anthropic rayon-core-v1.13.5000
[patch.crates-io]
rayon-core = { path = "../../../rayon-anthropic/rayon-core" }
